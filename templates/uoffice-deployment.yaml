{{- if .Values.uoffice.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unity-office.fullname" . }}-uoffice
  labels:
    {{- include "unity-office.labels" . | nindent 4 }}
    app.kubernetes.io/component: uoffice
spec:
  replicas: {{ .Values.uoffice.replicaCount }}
  strategy:
    # Sticky sessions on the uoffice Service keep an editor on the pod that
    # owns its document, so a surge pod can be added and the old pod drained
    # without disrupting open documents.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  selector:
    matchLabels:
      {{- include "unity-office.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: uoffice
  template:
    metadata:
      labels:
        {{- include "unity-office.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: uoffice
    spec:
      terminationGracePeriodSeconds: 60
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.uoffice.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "unity-office.fullname" . }}-sa
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uoffice
          image: "{{ .Values.uoffice.image.repository }}:{{ .Values.uoffice.image.tag }}"
          imagePullPolicy: {{ .Values.uoffice.image.pullPolicy }}
          ports:
            - name: collabora
              containerPort: {{ .Values.uoffice.service.port }}
              protocol: TCP
          env:
            - name: DONT_GEN_SSL_CERT
              value: {{ .Values.uoffice.env.dontGenSslCert | quote }}
            - name: extra_params
              value: {{ .Values.uoffice.env.extraParams | quote }}
            - name: aliasgroup1
              value: "{{ if .Values.uoffice.env.aliasgroup1 }}{{ .Values.uoffice.env.aliasgroup1 }},{{ end }}http://{{ include "unity-office.fullname" . }}-wopi:8055,http://{{ include "unity-office.fullname" . }}-web:3000,http://{{ include "unity-office.fullname" . }}-uoffice:9980{{ if .Values.ingress.enabled }},https://{{ .Values.ingress.hosts.web.host }},https://{{ .Values.ingress.hosts.collabora.host }}{{ end }}"
          args:
            # Collabora requires HTTPS for remote font config. Resolve the web
            # host through hostAliases (below) to Traefik directly so the font
            # manifest never goes through Cloudflare/VarmanWAF.
            - "--o:remote_font_config.url=https://{{ .Values.ingress.hosts.web.host }}/api/fonts.json"
            - "--o:num_prespawn_children={{ .Values.uoffice.numPrespawnChildren | default 3 }}"
            - "--o:per_document.max_concurrency={{ .Values.uoffice.maxConcurrency | default 4 }}"
            - "--o:net.post_allow.host[0]=.*"
            {{- with .Values.uoffice.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.uoffice.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /hosting/discovery
              port: collabora
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /hosting/discovery
              port: collabora
            initialDelaySeconds: 15
            periodSeconds: 10
            # A busy kit can take >1s to answer; a flappy probe removes the
            # endpoint and drops live editor WebSockets.
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.uoffice.resources | nindent 12 }}
      {{- with .Values.uoffice.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.uoffice.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.uoffice.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
