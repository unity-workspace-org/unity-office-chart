# Production values override for Unity Office
global:
  domain: unity-workspace.com

web:
  image:
    tag: "latest"
    pullPolicy: Always
  annotations:
    keel.sh/policy: "force"
    keel.sh/trigger: "poll"
    keel.sh/pollSchedule: "@every 1m"
    keel.sh/matchTag: "true"
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  resources:
    limits:
      cpu: 2000m
      memory: 2048Mi
    requests:
      cpu: 250m
      memory: 512Mi

uoffice:
  replicaCount: 1
  resources:
    limits:
      cpu: 4000m
      memory: 4096Mi
    requests:
      cpu: 500m
      memory: 1024Mi

wopi:
  image:
    tag: "latest"
    pullPolicy: Always
  annotations:
    keel.sh/policy: "force"
    keel.sh/trigger: "poll"
    keel.sh/pollSchedule: "@every 1m"
    keel.sh/matchTag: "true"
  persistence:
    enabled: true
    storageClass: "longhorn"
    size: 5Gi

udrive:
  url: "https://drive.unity-workspace.com"
  insecureSkipVerify: false
  storageDir: "/"
  auth:
    existingSecret: "udrive-credentials"
    usernameKey: "username"
    passwordKey: "password"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: null
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
  hosts:
    web:
      host: "office.unity-workspace.com"
      paths:
        - path: /
          pathType: Prefix
    collabora:
      host: "uoffice.unity-workspace.com"
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: true

realtime:
  enabled: true

vault:
  enabled: true
  address: "https://10.1.18.8:8200"
  role: "unity-office-role"
  secretPath: "secret/data/unity-office"
  tlsSkipVerify: true
