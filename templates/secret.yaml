{{- if and .Values.udrive.auth (not .Values.udrive.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "unity-office.fullname" . }}-udrive
  labels:
    {{- include "unity-office.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.udrive.auth.usernameKey | default "username" }}: {{ .Values.udrive.auth.username | quote }}
  {{ .Values.udrive.auth.passwordKey | default "password" }}: {{ .Values.udrive.auth.password | quote }}
{{- end }}
{{- if and (not .Values.auth.existingSecret) (or .Values.auth.betterAuthSecret .Values.auth.keycloak.clientSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "unity-office.fullname" . }}-auth
  labels:
    {{- include "unity-office.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.betterAuthSecret }}
  BETTER_AUTH_SECRET: {{ .Values.auth.betterAuthSecret | quote }}
  {{- end }}
  {{- if .Values.auth.keycloak.clientSecret }}
  KEYCLOAK_CLIENT_SECRET: {{ .Values.auth.keycloak.clientSecret | quote }}
  {{- end }}
{{- end }}
