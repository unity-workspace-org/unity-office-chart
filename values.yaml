# ==============================================================================
# Unity Office — Production Helm Values Configuration
# ==============================================================================

# Global configuration shared across components
global:
  domain: workspace.com
  imagePullSecrets:
    - name: ghcr-secret

# Naming overrides
nameOverride: ""
fullnameOverride: ""

# ServiceAccount configuration
serviceAccount:
  create: true
  name: "unity-office"
  annotations: {}

# ------------------------------------------------------------------------------
# 0. Authentication (Keycloak / OIDC)
# ------------------------------------------------------------------------------
auth:
  # Reference an existing Secret containing BETTER_AUTH_SECRET and (optionally)
  # KEYCLOAK_CLIENT_SECRET. When set, the inline values below are ignored.
  existingSecret: ""

  # Generate/rotate this with: openssl rand -base64 48
  # Required: signs Better Auth session cookies.
  betterAuthSecret: ""

  keycloak:
    issuer: "https://auth.unity-workspace.com/realms/unity-workspace"
    clientId: "unity-office"
    # Optional in-cluster issuer used for token refresh, revocation, logout and
    # JWKS. Bypasses the edge/WAF and keeps auth working if the public edge is
    # degraded. Leave empty to use the public issuer.
    internalIssuer: ""
    # Only required for confidential clients. Public clients leave this empty.
    clientSecret: ""

# ------------------------------------------------------------------------------
# 1. Unity Office Web Portal (Next.js Dashboard)
# ------------------------------------------------------------------------------
web:
  enabled: true
  replicaCount: 2

  image:
    repository: ghcr.io/unity-workspace-org/uoffice-web
    pullPolicy: Always
    tag: "latest"

  annotations: {}

  service:
    type: ClusterIP
    port: 3000
    # Sticky sessions keep a browser on one web replica. This complements the
    # database-backed refresh grace cache by avoiding most cross-pod token
    # rotation races.
    annotations:
      traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
      traefik.ingress.kubernetes.io/service.sticky.cookie.name: "office_web_route"
      traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
      traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: "lax"
      traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"

  # Shared read-write cache for template previews/thumbnails. Every web replica
  # sees the same rendered pages, so a template is rendered once instead of once
  # per pod, and cached previews survive pod restarts.
  previewCache:
    enabled: true
    accessMode: ReadWriteMany
    size: 10Gi
    storageClass: "longhorn"

  # Horizontal Pod Autoscaling (HPA)
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

  # Pod Disruption Budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 256Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - web
            topologyKey: kubernetes.io/hostname

# ------------------------------------------------------------------------------
# 2. Collabora Online Rendering Engine (uoffice)
# ------------------------------------------------------------------------------
uoffice:
  enabled: true
  replicaCount: 1
  numPrespawnChildren: 3
  maxConcurrency: 4

  image:
    repository: ghcr.io/unity-workspace-org/uoffice
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 9980
    # Collabora document sessions live in one pod. Traefik reads these
    # service-level annotations and returns a sticky cookie so the WebSocket
    # and the HTTP tile/upload requests stay on the same pod.
    annotations:
      traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
      traefik.ingress.kubernetes.io/service.sticky.cookie.name: "uoffice_route"
      traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
      traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: "none"
      traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"

  env:
    dontGenSslCert: "1"
    # NOTE: num_prespawn_children and remote_font_config.url are set via args: in the deployment template.
    # Only put params here that are NOT in args:.
    extraParams: "--o:ssl.enable=false --o:ssl.termination=true --o:welcome.enable=false --o:server_name=uoffice.unity-workspace.com --o:net.proto=IPv4 --o:forkit_timeout_secs=60 --o:per_document.limit_load_secs=60 --o:per_document.idle_timeout_secs=10800 --o:per_document.autosave_duration_secs=600 --o:net.post_allow.host[0]=.*"
    # Additional domains allowed to frame Collabora (comma-separated)
    aliasgroup1: ""

  securityContext:
    capabilities:
      add:
        - MKNOD
        - SYS_ADMIN

  resources:
    limits:
      cpu: 4000m
      memory: 8192Mi
    requests:
      cpu: 1000m
      memory: 2048Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

# ------------------------------------------------------------------------------
# 3. WOPI Storage Bridge
#    Two replicas share a ReadWriteMany drafts volume so deployments do not
#    interrupt saves (see values-prod.yaml).
# ------------------------------------------------------------------------------
wopi:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/unity-workspace-org/uoffice-wopi
    pullPolicy: Always
    tag: "latest"

  annotations: {}

  service:
    type: ClusterIP
    port: 8055

  # Persistent storage for temporary document drafts
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: ""

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Host aliases to resolve internal cluster ingress endpoints
  hostAliases:
    - ip: "10.1.16.200"
      hostnames:
        - "office.unity-workspace.com"
        - "uoffice.unity-workspace.com"

# ------------------------------------------------------------------------------
# 4. Template Preview Render Service (LibreOfficeKit)
# ------------------------------------------------------------------------------
# Dedicated headless renderer for template thumbnails/previews. The web portal
# calls it through TEMPLATE_RENDER_SERVICE_URL and automatically falls back to
# the Collabora convert-to-PDF chain when this service is disabled or unhealthy.
render:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/unity-workspace-org/uoffice-render
    pullPolicy: Always
    tag: "latest"

  annotations: {}

  service:
    type: ClusterIP
    port: 8057

  # Renderer limits (passed to the render service as RENDER_* env vars)
  width: 1600
  maxPages: 35
  maxConcurrency: 1
  timeoutSecs: 90
  maxUploadMb: 50
  # JPEG keeps template previews 3-5x smaller than PNG.
  imageFormat: jpeg
  jpegQuality: 85

  # Scratch space for uploaded documents and rendered page output
  tmpDirSizeLimit: 2Gi

  # Extra environment variables for the render container
  extraEnv: []

  resources:
    limits:
      cpu: 2000m
      memory: 4096Mi
    requests:
      cpu: 250m
      memory: 512Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - render
            topologyKey: kubernetes.io/hostname

# ------------------------------------------------------------------------------
# 5. UDrive (ownCloud Infinite Scale) Storage Integration
# ------------------------------------------------------------------------------
udrive:
  # Base URL of your UDrive deployment (in-cluster or external)
  url: "https://drive.workspace.com"

  # Directory inside UDrive where Office documents are stored
  storageDir: "/"

  # Set true if UDrive uses self-signed TLS certificates
  insecureSkipVerify: false

  # Web URL to display in 9-dot App Launcher
  webUrl: "https://drive.workspace.com"

  # Service Account credentials for WebDAV sync
  auth:
    username: "admin"
    password: "admin"
    # Or reference an existing Kubernetes secret:
    existingSecret: ""
    usernameKey: "username"
    passwordKey: "password"

# ------------------------------------------------------------------------------
# 6. CloudNativePG PostgreSQL Database (User Settings & Pinned Templates Sync)
# ------------------------------------------------------------------------------
database:
  enabled: true
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:16.4"
  databaseName: "unity_office"
  user: "office"
  storage:
    size: "5Gi"
    storageClass: "longhorn"

# ------------------------------------------------------------------------------
# 7. HashiCorp Vault Agent Integration
# ------------------------------------------------------------------------------
vault:
  # Enable Vault Agent sidecar injection
  enabled: false
  # Vault server address
  address: "https://10.1.18.8:8200"
  # Kubernetes auth role in Vault
  role: "unity-office-role"
  # Secret path in Vault (KV v2)
  secretPath: "secret/data/unity-office"
  # Skip TLS certificate verification when connecting to Vault
  tlsSkipVerify: true
  # ConfigMap name for Vault Root CA (automatically populated if caCert is set)
  caConfigMap: ""
  # Vault Root CA certificate (used to verify Vault server TLS)
  caCert: ""

# ------------------------------------------------------------------------------
# 8. Ingress Configuration
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: "traefik"
  retry:
    enabled: true
    attempts: 3
    initialInterval: "100ms"

  # Collabora paths proxied on the web host. Serving the editor from the same
  # origin avoids Brave Shields / ad-blockers treating the iframe as a
  # third-party frame and refusing to connect.
  #
  # NOTE: /browser is intentionally NOT listed here. Static editor assets must
  # not receive the sticky `uoffice_route` cookie, otherwise Cloudflare refuses
  # to cache them and every iframe load downloads ~1.1 MB through the origin
  # tunnel. They are routed by the separate static Ingress below.
  collaboraPaths:
    - /cool
    - /coolws
    - /hosting
    - /loleaflet
    - /lool

  # Stateless Collabora assets. Served by the same uoffice service but through
  # an Ingress without sticky-cookie annotations so the edge can cache them.
  staticPaths:
    - /browser

  staticAnnotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"

  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    # SSL enforcement & HSTS
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "uoffice_route"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "uoffice"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";

  hosts:
    web:
      host: office.workspace.com
      paths:
        - path: /
          pathType: Prefix
    collabora:
      host: uoffice.workspace.com
      paths:
        - path: /
          pathType: Prefix

  tls:
    - secretName: unity-office-tls
      hosts:
        - office.workspace.com
        - uoffice.workspace.com

# ------------------------------------------------------------------------------
# 9. Network Policy (Optional Zero-Trust Security)
# ------------------------------------------------------------------------------
networkPolicy:
  enabled: false

# ------------------------------------------------------------------------------
# 10. Unity Realtime Service
# ------------------------------------------------------------------------------
realtime:
  # Set to true to expose the /ws path in the ingress, routing WebSocket and
  # HTTP publish requests directly to the unity-realtime ClusterIP service.
  enabled: true
