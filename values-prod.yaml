# Production values override for Unity Office
global:
  domain: unity-workspace.com

web:
  image:
    tag: "82242389"
    pullPolicy: Always
  annotations: {}
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  resources:
    limits:
      cpu: 2000m
      memory: 2048Mi
    requests:
      cpu: 250m
      memory: 512Mi

uoffice:
  # Collabora keeps each document session (DocBrokers + childId) in one pod's
  # memory, so all requests for a document must reach the same pod. Sticky
  # sessions are configured on the uoffice Service (Traefik reads the
  # service.sticky.cookie annotations there). Verify the Set-Cookie:
  # uoffice_route=... header on /browser and /cool before raising this.
  replicaCount: 2
  numPrespawnChildren: 8
  maxConcurrency: 8
  image:
    # Bumped to the built commit SHA by the unity-office-server CI pipeline.
    tag: "99a6d1c4"
    # Always pull the rebuilt overlay image so CSP/config fixes reach the cluster.
    pullPolicy: Always
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - uoffice
            topologyKey: kubernetes.io/hostname
  resources:
    limits:
      cpu: 8000m
      memory: 8192Mi
    requests:
      cpu: 2000m
      memory: 2048Mi

render:
  enabled: true
  replicaCount: 2
  image:
    tag: "99a6d1c4"
    pullPolicy: Always
  # Keep the renderer on node1 as requested. The image and scratch volume are
  # node-local, and rendering is CPU-heavy.
  nodeSelector:
    kubernetes.io/hostname: node1
  resources:
    limits:
      cpu: 2000m
      memory: 4096Mi
    requests:
      cpu: 500m
      memory: 1024Mi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - render
            topologyKey: kubernetes.io/hostname

wopi:
  image:
    tag: "99a6d1c4"
    pullPolicy: Always
  annotations: {}
  persistence:
    enabled: true
    storageClass: "longhorn"
    size: 5Gi

udrive:
  url: "https://drive.unity-workspace.com"
  insecureSkipVerify: false
  storageDir: "/"
  auth:
    existingSecret: "udrive-credentials"
    usernameKey: "username"
    passwordKey: "password"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "uoffice_route"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
  hosts:
    web:
      host: "office.unity-workspace.com"
      paths:
        - path: /
          pathType: Prefix
    collabora:
      host: "uoffice.unity-workspace.com"
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: true

database:
  enabled: true
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:16.4"
  databaseName: "unity_office"
  user: "office"
  storage:
    size: "5Gi"
    storageClass: "longhorn"

vault:
  enabled: false
