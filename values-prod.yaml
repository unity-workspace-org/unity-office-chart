# Production values override for Unity Office
global:
  domain: unity-workspace.com

web:
  # "iframe" = legacy embedded editor, "direct" = top-level Collabora editor.
  editorMode: "direct"
  image:
    tag: "1176df1a"
    pullPolicy: Always
  annotations: {}
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  resources:
    limits:
      cpu: 2000m
      memory: 2048Mi
    requests:
      cpu: 250m
      memory: 512Mi

uoffice:
  # Collabora keeps each document session (DocBrokers + childId) in one pod's
  # memory, so all requests for a document must reach the same pod. Sticky
  # sessions are configured on the uoffice Service (Traefik reads the
  # service.sticky.cookie annotations there). Verify the Set-Cookie:
  # uoffice_route=... header on /browser and /cool before raising this.
  replicaCount: 2
  numPrespawnChildren: 8
  maxConcurrency: 8
  image:
    # Bumped to the built commit SHA by the unity-office-server CI pipeline.
    tag: "380bebf6"
    # Always pull the rebuilt overlay image so CSP/config fixes reach the cluster.
    pullPolicy: Always
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - uoffice
            topologyKey: kubernetes.io/hostname
  resources:
    limits:
      cpu: 8000m
      memory: 8192Mi
    requests:
      cpu: 2000m
      memory: 2048Mi

render:
  # Render the real first page/slide from the saved document so recent-file
  # cards reflect the user's edits (DOCX/ODG especially have no other real
  # renderer). The web save path renders only the cover (maxPages=1).
  enabled: true
  replicaCount: 2
  image:
    tag: "380bebf6"
    pullPolicy: Always
  # Keep the renderer on node1 as requested. The image and scratch volume are
  # node-local, and rendering is CPU-heavy.
  nodeSelector:
    kubernetes.io/hostname: node1
  resources:
    limits:
      cpu: 2000m
      memory: 4096Mi
    requests:
      cpu: 500m
      memory: 1024Mi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - render
            topologyKey: kubernetes.io/hostname

wopi:
  # Two replicas on a shared RWX draft volume: a deploy no longer takes the
  # bridge offline, so a save is never routed to a terminated pod.
  replicaCount: 2
  image:
    # Pinned on purpose: only bump when the bridge itself changes, otherwise
    # every chart commit restarts it and interrupts saves.
    tag: "18008c3"
    pullPolicy: Always
  annotations: {}
  persistence:
    enabled: true
    accessMode: ReadWriteMany
    storageClass: "longhorn"
    size: 5Gi

udrive:
  # Server-to-server UDrive traffic (web + WOPI bridge) stays inside the
  # cluster. Routing it through the public hostname put Cloudflare/WAF in the
  # document I/O path, so a public-entry outage turned every Drive-backed
  # action in Office into a 502.
  url: "https://udrive.udrive.svc.cluster.local:9200"
  # The in-cluster OCIS endpoint uses its internal certificate.
  insecureSkipVerify: true
  storageDir: "/"
  # Browser-facing links (Show in Drive, folder badges) must stay public.
  webUrl: "https://drive.unity-workspace.com"
  auth:
    existingSecret: "udrive-credentials"
    usernameKey: "username"
    passwordKey: "password"

ingress:
  enabled: true
  className: "traefik"
  retry:
    enabled: true
    attempts: 3
    initialInterval: "100ms"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "unity-office-unity-office-retry@kubernetescrd"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "uoffice_route"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
  staticAnnotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "unity-office-unity-office-retry@kubernetescrd"
  hosts:
    web:
      host: "office.unity-workspace.com"
      paths:
        - path: /
          pathType: Prefix
    collabora:
      host: "uoffice.unity-workspace.com"
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: true

database:
  enabled: true
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:16.4"
  databaseName: "unity_office"
  user: "office"
  storage:
    size: "5Gi"
    storageClass: "longhorn"

vault:
  enabled: false
