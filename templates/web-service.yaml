{{- if .Values.web.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "unity-office.fullname" . }}-web
  labels:
    {{- include "unity-office.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "unity-office.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
{{- end }}
