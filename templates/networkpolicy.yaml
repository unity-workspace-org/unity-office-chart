{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "unity-office.fullname" . }}-netpol
  labels:
    {{- include "unity-office.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "unity-office.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 9980
        - protocol: TCP
          port: 8055
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 9980
        - protocol: TCP
          port: 8055
{{- end }}
