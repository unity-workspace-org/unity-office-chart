{{- if and .Values.ingress.enabled .Values.ingress.retry.enabled -}}
{{- /*
Cloudflare/Traefik surface a bare 502 when the pod that received a request is
terminated by a rolling update. The retry middleware re-dispatches transient
backend failures to the remaining ready replica instead of showing the error
page to the user.
*/ -}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "unity-office.fullname" . }}-retry
  labels:
    {{- include "unity-office.labels" . | nindent 4 }}
spec:
  retry:
    attempts: {{ .Values.ingress.retry.attempts | default 3 }}
    initialInterval: {{ .Values.ingress.retry.initialInterval | default "100ms" }}
{{- end -}}
