# Production values override for Unity Office
global:
  domain: unity-workspace.com

web:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  resources:
    limits:
      cpu: 2000m
      memory: 2048Mi
    requests:
      cpu: 250m
      memory: 512Mi

uoffice:
  replicaCount: 2
  resources:
    limits:
      cpu: 4000m
      memory: 4096Mi
    requests:
      cpu: 500m
      memory: 1024Mi

udrive:
  url: "https://drive.unity-workspace.com"
  insecureSkipVerify: false
  storageDir: "/"
  auth:
    existingSecret: "udrive-credentials"
    usernameKey: "username"
    passwordKey: "password"

ingress:
  enabled: true
  className: "traefik"
  hosts:
    web:
      host: "office.unity-workspace.com"
    collabora:
      host: "uoffice.unity-workspace.com"
  tls:
    - secretName: unity-office-prod-tls
      hosts:
        - "office.unity-workspace.com"
        - "uoffice.unity-workspace.com"

networkPolicy:
  enabled: true
