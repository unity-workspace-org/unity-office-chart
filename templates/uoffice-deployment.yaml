{{- if .Values.uoffice.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unity-office.fullname" . }}-uoffice
  labels:
    {{- include "unity-office.labels" . | nindent 4 }}
    app.kubernetes.io/component: uoffice
spec:
  replicas: {{ .Values.uoffice.replicaCount }}
  selector:
    matchLabels:
      {{- include "unity-office.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: uoffice
  template:
    metadata:
      labels:
        {{- include "unity-office.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: uoffice
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: uoffice
          image: "{{ .Values.uoffice.image.repository }}:{{ .Values.uoffice.image.tag }}"
          imagePullPolicy: {{ .Values.uoffice.image.pullPolicy }}
          ports:
            - name: collabora
              containerPort: {{ .Values.uoffice.service.port }}
              protocol: TCP
          env:
            - name: DONT_GEN_SSL_CERT
              value: {{ .Values.uoffice.env.dontGenSslCert | quote }}
            - name: extra_params
              value: {{ .Values.uoffice.env.extraParams | quote }}
            - name: aliasgroup1
              value: "{{ .Values.uoffice.env.aliasgroup1 }},http://{{ include "unity-office.fullname" . }}-wopi:8055,http://{{ include "unity-office.fullname" . }}-web:3000{{ if .Values.ingress.enabled }},https://{{ .Values.ingress.hosts.web.host }},https://{{ .Values.ingress.hosts.collabora.host }}{{ end }}"
          {{- with .Values.uoffice.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /hosting/discovery
              port: collabora
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /hosting/discovery
              port: collabora
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.uoffice.resources | nindent 12 }}
      {{- with .Values.uoffice.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.uoffice.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.uoffice.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
