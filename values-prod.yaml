# Production values override for Unity Office
global:
  domain: unity-workspace.com

web:
  image:
    tag: "latest"
    pullPolicy: Always
  annotations:
    keel.sh/policy: "force"
    keel.sh/trigger: "poll"
    keel.sh/pollSchedule: "@every 1m"
    keel.sh/matchTag: "true"
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  resources:
    limits:
      cpu: 2000m
      memory: 2048Mi
    requests:
      cpu: 250m
      memory: 512Mi

uoffice:
  replicaCount: 1
  numPrespawnChildren: 3
  resources:
    limits:
      cpu: 4000m
      memory: 8192Mi
    requests:
      cpu: 1000m
      memory: 2048Mi

wopi:
  image:
    tag: "latest"
    pullPolicy: Always
  annotations:
    keel.sh/policy: "force"
    keel.sh/trigger: "poll"
    keel.sh/pollSchedule: "@every 1m"
    keel.sh/matchTag: "true"
  persistence:
    enabled: true
    storageClass: "longhorn"
    size: 5Gi

udrive:
  url: "https://drive.unity-workspace.com"
  insecureSkipVerify: false
  storageDir: "/"
  auth:
    existingSecret: "udrive-credentials"
    usernameKey: "username"
    passwordKey: "password"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: null
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: "uoffice_route"
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: "none"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "uoffice_route"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
  hosts:
    web:
      host: "office.unity-workspace.com"
      paths:
        - path: /
          pathType: Prefix
    collabora:
      host: "uoffice.unity-workspace.com"
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: true

realtime:
  enabled: true

vault:
  enabled: false
