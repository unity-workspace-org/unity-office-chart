{{- if .Values.web.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unity-office.fullname" . }}-web
  labels:
    {{- include "unity-office.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "unity-office.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "unity-office.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      {{- if .Values.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        {{- if .Values.vault.address }}
        vault.hashicorp.com/agent-vault-addr: {{ .Values.vault.address | quote }}
        {{- end }}
        {{- if or .Values.vault.caConfigMap .Values.vault.caCert }}
        vault.hashicorp.com/agent-ca-config-map: {{ default (printf "%s-vault-ca" (include "unity-office.fullname" .)) .Values.vault.caConfigMap | quote }}
        vault.hashicorp.com/agent-ca-cert: "/vault/tls/vault-ca.crt"
        {{- end }}
        {{- if .Values.vault.tlsSkipVerify }}
        vault.hashicorp.com/tls-skip-verify: "true"
        {{- end }}
        vault.hashicorp.com/agent-run-as-user: "1001"
        vault.hashicorp.com/agent-run-as-group: "1001"
        vault.hashicorp.com/agent-inject-secret-database: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-database: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" -}}`}}
          DATABASE_URL={{`{{ .Data.data.DATABASE_URL }}`}}
          {{`{{- end -}}`}}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "unity-office.fullname" . }}-sa
      {{- end }}
      {{- with .Values.web.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          {{- with .Values.web.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.web.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "unity-office.fullname" . }}-config
          env:
            - name: UDRIVE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.udrive.auth.existingSecret }}{{ .Values.udrive.auth.existingSecret }}{{ else }}{{ include "unity-office.fullname" . }}-udrive{{ end }}
                  key: {{ .Values.udrive.auth.usernameKey | default "username" }}
            - name: UDRIVE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.udrive.auth.existingSecret }}{{ .Values.udrive.auth.existingSecret }}{{ else }}{{ include "unity-office.fullname" . }}-udrive{{ end }}
                  key: {{ .Values.udrive.auth.passwordKey | default "password" }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
