# Staging values override for Unity Office
global:
  domain: unity-workspace.com

web:
  image:
    tag: "ab46be03"
    pullPolicy: Always
  annotations: {}
  replicaCount: 1
  autoscaling:
    enabled: false

uoffice:
  replicaCount: 1
  numPrespawnChildren: 2
  resources:
    limits:
      cpu: 2000m
      memory: 4096Mi
    requests:
      cpu: 500m
      memory: 1024Mi

wopi:
  image:
    tag: "1e732952"
  persistence:
    enabled: true
    storageClass: "longhorn"
    size: 2Gi

udrive:
  url: "https://staging-drive.unity-workspace.com"
  insecureSkipVerify: false
  storageDir: "/"
  auth:
    existingSecret: "udrive-credentials"
    usernameKey: "username"
    passwordKey: "password"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: "uoffice_route"
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: "none"
  hosts:
    web:
      host: "staging-office.unity-workspace.com"
      paths:
        - path: /
          pathType: Prefix
    collabora:
      host: "staging-uoffice.unity-workspace.com"
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false

database:
  enabled: true
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:16.4"
  databaseName: "unity_office_staging"
  user: "office"
  storage:
    size: "2Gi"
    storageClass: "longhorn"

vault:
  enabled: false
